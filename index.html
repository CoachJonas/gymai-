<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gym AI v13.11 – Auto-Matching</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--mut:#9fb3c8;--txt:#e9f1ff;--b:#1b2747;--a:#4da3ff;--ok:#1ec28b;--warn:#ffcc66}
*{box-sizing:border-box;font-family:-apple-system,system-ui,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:5;background:#0b1220cc;backdrop-filter:blur(6px);border-bottom:1px solid var(--b);padding:12px 14px}
h1{margin:0;font-size:18px;font-weight:800;display:flex;gap:8px;align-items:center}
.badge{font-size:12px;background:#102043;border:1px solid #1b2a50;color:#9fc4ff;padding:2px 8px;border-radius:999px}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{background:#2a67ff;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700}
button.ghost{background:#0f1933;color:#cfe2ff;border:1px solid var(--b)}
input,select,textarea{width:100%;background:#0b152c;border:1px solid var(--b);border-radius:10px;color:var(--txt);padding:10px}
.small{color:var(--mut);font-size:12px}
.grid{display:grid;gap:10px}
.ex{background:#0f1933;border:1px solid var(--b);border-radius:12px;padding:10px}
.ex h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
footer{color:#6f87a6;text-align:center;padding:20px 0 40px}
dialog{border:none;border-radius:14px;background:#0e1731;color:var(--txt);max-width:800px;width:92%;padding:0}
dialog header{padding:12px;border-bottom:1px solid #203058}
dialog .content{padding:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Gym AI <span class="badge">v13.11 Auto-Matching</span></h1></header>
<div class="wrap">
  <div class="row">
    <button id="btnImport">Backup-Text einfügen</button>
    <button id="btnExport" class="ghost">CSV Export</button>
    <button id="btnHome" class="ghost">Zur Kachel hinzufügen (Hinweis)</button>
  </div>
  <p class="small">Offline • Daten bleiben lokal • Auto-Matching verbindet alte IDs/Labels mit dem Plan • Smart-Progression: halten / +1 kg / +2,5 kg / −1 kg</p>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <select id="session">
          <option value="night_upper">Nachtschicht – Oberkörper</option>
          <option value="night_lower">Nachtschicht – Unterkörper</option>
          <option value="free_pull">Freie Tage – Pull</option>
          <option value="free_push">Freie Tage – Push</option>
          <option value="free_legs">Freie Tage – Beine</option>
        </select>
        <button id="btnSuggest" class="ghost">Empfehlen</button>
      </div>
      <button id="btnLoad">Plan laden</button>
    </div>
    <div id="coverage" class="small"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="badge" id="today">–</div>
      <button id="btnAddSet" class="ghost">+ Satz</button>
    </div>
    <div id="plan" class="grid" style="margin-top:10px"></div>
    <button id="btnSave" class="ghost">Sätze speichern</button>
  </div>

  <footer>© Gym AI</footer>
</div>

<dialog id="dlg">
  <header><b>Backup-Text einfügen</b></header>
  <div class="content">
    <p class="small">Füge deinen JSON oder CSV hier ein. App versteht beide. Danach „Importieren“.</p>
    <textarea id="ta" rows="12" placeholder='{"version":"13.10-import", "logs":[...]}'></textarea>
    <div class="row" style="justify-content:flex-end">
      <button id="dlgClose" class="ghost">Schließen</button>
      <button id="dlgOk">Importieren</button>
    </div>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const LS_JSON="gymai.v13.logs.json";  // strukturierter Speicher (JSON)
const LS_CSV ="gymai.v13.logs.csv";   // optionaler CSV-Schatten
const LS_LAST="gymai.v13.last.session";

const planEl=$("#plan"), todayEl=$("#today"), sessionSel=$("#session"), coverageEl=$("#coverage");

// Ziel-Plan (Bezeichner = sichtbarer Name)
const PLAN={
  night_upper:[
    ["Schrägbankdrücken KH","3×6–10","incl_db"],
    ["Klimmzüge/Latzug","3×6–10","pullup"],
    ["Rudern Low Row","3×8–12","row_low"],
    ["Schulterdrücken","3×6–10","ohp"],
    ["Seitheben","2×12–15","laterals"],
    ["Face Pulls","2×12–15","facepull"]
  ],
  night_lower:[
    ["Kniebeugen/Beinpresse","3×6–10","squat_press2"],
    ["Gestrecktes KH","3×6–10","rdl2"],
    ["Beinstrecker","2×12–15","legext2"],
    ["Beinbeuger","3×8–12","legcurl2"],
    ["Waden stehend","4×10–20","calf_stand"],
    ["Bauch","3×12–20","abs2"]
  ],
  free_pull:[
    ["Latzug eng","3×6–10","lat_narrow"],
    ["Rudern LH/T-Bar","4×8–15","row_tbar"],
    ["Klimmzüge (weit/neutral/Maschine)","3×6–10","pullup_w"],
    ["Shrugs","3×10–12","shrugs"],
    ["Bizeps Curls","3×10–12","bi_curls"],
    ["Hammer Curls","3×10–12","hammer"],
    ["Überzüge am Kabelzug","3×12–15","cable_pullover"]
  ],
  free_push:[
    ["Flachbankdrücken KH","4×6–10","bench_db"],
    ["Schrägbankdrücken KH","4×6–10","incl_db"],
    ["Dips","3×8–12","dips"],
    ["Schulterdrücken","3×6–10","ohp"],
    ["Seitheben","3×12–15","laterals"],
    ["Trizepsdrücken","3×8–12","pushdown"]
  ],
  free_legs:[
    ["Kniebeugen/Beinpresse","4×6–10","squat_press2"],
    ["Frontkniebeugen","3×8–12","front"],
    ["Beinstrecker","3×12–15","legext2"],
    ["Beinbeuger","3×10–12","legcurl2"],
    ["Waden stehend","4×10–20","calf_stand"],
    ["Waden sitzend","3×10–20","calf_sit"],
    ["Seil-Crunch","3×10–15","rope_crunch"],
    ["Bauch","3×12–20","abs2"]
  ]
};

// Aliase (sichtbarer Name → mögliche IDs / alte Bezeichnungen)
const ALIASES = {
  "Schrägbankdrücken KH": ["incl_db","incline_db","schrägbank_kh"],
  "Klimmzüge/Latzug": ["pullup","lat_pull","pullups","lat_narrow","pullup_w"],
  "Rudern Low Row": ["row_low","low_row","row_tbar","tbar_row"],
  "Schulterdrücken": ["ohp","overhead_press","ohp_m"],
  "Seitheben": ["laterals","side_raises","laterals_ds"],
  "Face Pulls": ["facepull","reverse_flys","reverse_fly"],
  "Überzüge am Kabelzug": ["cable_pullover","pullover_cable"],
  "Latzug eng": ["lat_narrow","lat_narrow_machine","latzug_eng"],
  "Rudern LH/T-Bar": ["row_tbar","tbar_row","low_row"],
  "Klimmzüge (weit/neutral/Maschine)": ["pullup_w","assisted_pullup_wide","pullup"],
  "Shrugs": ["shrugs"],
  "Bizeps Curls": ["bi_curls","biceps_curl"],
  "Hammer Curls": ["hammer","hammer_curl"],
  "Kniebeugen/Beinpresse": ["squat_press2","leg_press","squat_press"],
  "Frontkniebeugen": ["front"],
  "Beinstrecker": ["legext2","leg_extension"],
  "Beinbeuger": ["legcurl2","leg_curl"],
  "Waden stehend": ["calf_stand","standing_calf"],
  "Waden sitzend": ["calf_sit","seated_calf"],
  "Seil-Crunch": ["rope_crunch","cable_crunch"],
  "Bauch": ["abs2","abs"]
};

// ---- Speicher / Daten ----
function loadJSON(){ try{ return JSON.parse(localStorage.getItem(LS_JSON)||'{"logs":[]}'); }catch(e){ return {"logs":[]}; } }
function saveJSON(j){ localStorage.setItem(LS_JSON, JSON.stringify(j)); }
function loadCSV(){ return localStorage.getItem(LS_CSV)||""; }
function saveCSV(csv){ localStorage.setItem(LS_CSV,csv); }

function toCSV(logs){
  const head=`"date","sessionId","exerciseId","weight","reps","note"`;
  const rows=logs.map(r=>`"${r.date}","${r.sessionId}","${r.exerciseId}","${r.weight}","${Array.isArray(r.reps)?r.reps.join('-'):r.reps}","${r.note||""}"`);
  return [head,...rows].join("\n");
}

// string-Normalize (für robustes Matching)
function norm(s){ return String(s||"").toLowerCase().replace(/\s+/g," ").replace(/[^a-z0-9äöüß\- ]/g,"").trim(); }

// Mapping sichtbarer Plan-Name → beste exerciseId aus Logs
function mapExerciseId(planLabel, logs){
  const label = norm(planLabel);
  // 1) direkte ALIASES
  for(const key in ALIASES){
    if(norm(key)===label){
      const ids=ALIASES[key];
      // falls mehrere IDs: wähle die, die in logs am häufigsten vorkommt
      const counts={}; ids.forEach(id=>{
        counts[id]=logs.filter(x=>x.exerciseId===id).length;
      });
      const pick = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
      return pick && pick[1]>0 ? pick[0] : ids[0];
    }
  }
  // 2) heuristik: substring-treffer gegen bekannte IDs in Logs
  const uniqIds=[...new Set(logs.map(x=>x.exerciseId))];
  const scored = uniqIds.map(id=>{
    const n=norm(id);
    let score=0;
    if(label.includes(n) || n.includes(label)) score+=2;
    // kleine Heuristik für deutsche Begriffe
    if((/bank|press|drueck/.test(label) && /bench|incl|press/.test(n))) score++;
    if((/zug|pull|lat/.test(label) && /pull|lat/.test(n))) score++;
    if((/rudern|row/.test(label) && /row/.test(n))) score++;
    if((/wade|calf/.test(label) && /calf/.test(n))) score++;
    return {id,score};
  }).sort((a,b)=>b.score-a.score);
  return (scored[0] && scored[0].score>0) ? scored[0].id : null;
}

// letzten Satz für exerciseId holen
function lastSet(logs, exId){
  const h = logs.filter(l=>l.exerciseId===exId).sort((a,b)=> (a.date<b.date?1:-1));
  return h[0]||null;
}

// Smart-Progression
function suggestNext(last){
  if(!last) return {weight:"", hint:"neu einarbeiten"};
  const reps = Array.isArray(last.reps) ? last.reps : String(last.reps).split(/[-,]/).map(x=>parseInt(x,10)||0);
  const min = Math.min(...reps);
  const max = Math.max(...reps);
  let delta = 0;
  if(reps.length>=3 && reps.every(r=>r>=10)) delta = +2.5;
  else if(max>=10 && min>=6) delta = +1;
  else if(min<6) delta = -1;
  const next = Math.max(0, Number(last.weight||0)+delta);
  const msg = delta>0?`+${delta} kg`:delta<0?`${delta} kg`:`halten`;
  return {weight: String(next), hint:`letztes Mal ${last.weight||0} kg • ${reps.join("/") } → ${msg}`};
}

function parseInputText(txt){
  txt=txt.trim();
  // JSON?
  if(txt.startsWith("{")||txt.startsWith("[")){
    const j = JSON.parse(txt);
    // ggf. CSV im Feld logs?
    if(Array.isArray(j.logs)) return j.logs.map(x=>({
      date: x.date,
      sessionId: x.sessionId || sessionKeyFromLabel(x.session),
      exerciseId: x.exerciseId || idFromAliases(x.exercise),
      weight: Number(x.weight)||0,
      reps: Array.isArray(x.reps)? x.reps : String(x.reps||"").split(/[-,]/).map(n=>parseInt(n,10)||0),
      note: x.note||""
    }));
    // plain array
    if(Array.isArray(j)) return j;
    return [];
  }
  // CSV
  const lines=txt.split(/\r?\n/).filter(Boolean);
  if(!lines.length) return [];
  const hasHead = /date.*session/i.test(lines[0]);
  if(hasHead) lines.shift();
  const out=[];
  for(const line of lines){
    const m=line.match(/^\"?(.*?)\"?,\"?(.*?)\"?,\"?(.*?)\"?,\"?(.*?)\"?,\"?(.*?)\"?,\"?(.*?)\"?$/);
    if(!m) continue;
    const [_,date,sessionId,exerciseId,weight,reps,note]=m;
    out.push({
      date, sessionId, exerciseId,
      weight: Number(weight)||0,
      reps: String(reps||"").split(/[-,]/).map(n=>parseInt(n,10)||0),
      note: note||""
    });
  }
  return out;
}

function sessionKeyFromLabel(label){
  const s = norm(label);
  if(s.includes("oberkoerper")||s.includes("oberkörper")) return "night_upper";
  if(s.includes("unterkoerper")||s.includes("unterkörper")) return "night_lower";
  if(s.includes("pull")) return "free_pull";
  if(s.includes("push")) return "free_push";
  if(s.includes("bein")) return "free_legs";
  return "free_pull";
}
function idFromAliases(exLabel){
  const s=norm(exLabel);
  for(const k in ALIASES){
    if(norm(k)===s) return ALIASES[k][0];
  }
  return s.replace(/\s+/g,"_");
}

// Import/Export/UI
const dlg=$("#dlg"), ta=$("#ta");
$("#btnImport").onclick=()=>{ta.value=""; dlg.showModal();};
$("#dlgClose").onclick=()=>dlg.close();
$("#dlgOk").onclick=()=>{
  try{
    const txt=ta.value.trim();
    if(!txt){ alert("Bitte JSON oder CSV einfügen."); return; }
    const newLogs=parseInputText(txt);
    const store = loadJSON();
    store.logs = [...store.logs, ...newLogs].sort((a,b)=> (a.date<b.date?1:-1));
    saveJSON(store);
    saveCSV(toCSV(store.logs));
    alert("Import ok: "+newLogs.length+" Sätze.");
    dlg.close();
    renderPlan();
  }catch(e){
    console.error(e); alert("Import fehlgeschlagen.");
  }
};

$("#btnExport").onclick=()=>{
  const store = loadJSON(); const csv = toCSV(store.logs||[]);
  if(!csv){ alert("Keine Daten."); return; }
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="training_logs.csv"; a.click();
  URL.revokeObjectURL(url);
};

$("#btnHome").onclick=()=>alert('Falls noch nicht als Kachel: Im Browser „Teilen“ → „Zum Home-Bildschirm“.');

$("#btnAddSet").onclick=()=>{document.querySelectorAll(".ex .row3").forEach(row=>{
  if(row.children.length<4){const i=document.createElement("input"); i.placeholder="Wdh"; row.appendChild(i);}
})};

$("#btnSuggest").onclick=()=>{
  const store=loadJSON(), now=new Date(), week=7*24*3600*1000;
  const cnt={night_upper:0,night_lower:0,free_pull:0,free_push:0,free_legs:0};
  (store.logs||[]).forEach(r=>{ if(now - new Date(r.date) <= week && cnt[r.sessionId]!=null) cnt[r.sessionId]++; });
  const order=Object.entries(cnt).sort((a,b)=>a[1]-b[1]);
  if(order.length){ sessionSel.value=order[0][0]; renderPlan(); }
};

$("#btnLoad").onclick=renderPlan;
$("#btnSave").onclick=()=>{
  // speichert nur Notizen nicht; (Sets werden i.d.R. aus Historie gezogen – optionaler Edit später)
  alert("Sätze werden aktuell automatisch aus der Historie gelesen. Manuelle Satzspeicherung folgt in v13.12.");
};

function coverage(rows){
  const now=new Date(), week=7*24*3600*1000, c={push:0,pull:0,legs:0};
  (rows||[]).forEach(r=>{
    if(now - new Date(r.date) > week) return;
    if(r.sessionId.includes("push")) c.push++;
    if(r.sessionId.includes("pull")||r.sessionId.includes("upper")) c.pull++;
    if(r.sessionId.includes("legs")||r.sessionId.includes("lower")) c.legs++;
  });
  return `Abdeckung (7T): Push ${c.push}/2 · Pull ${c.pull}/2 · Beine ${c.legs}/2`;
}

function renderPlan(){
  const sid=sessionSel.value; localStorage.setItem(LS_LAST,sid);
  const store=loadJSON(); const logs=store.logs||[];
  const today=new Date().toISOString().slice(0,10);
  $("#today").textContent=`${sessionSel.options[sessionSel.selectedIndex].text} · ${today}`;
  coverageEl.textContent = coverage(logs);

  planEl.innerHTML="";
  (PLAN[sid]||[]).forEach(([label,target,defaultId])=>{
    const mappedId = mapExerciseId(label, logs) || defaultId;
    const last = lastSet(logs, mappedId);
    const sug = suggestNext(last);
    const ex=document.createElement("div"); ex.className="ex"; ex.dataset.ex=mappedId;
    ex.innerHTML = `
      <h3>${label}<span class="badge">Ziel ${target}</span></h3>
      <div class="small">${sug.hint}</div>
      <div class="row3" style="margin-top:6px">
        <input placeholder="Wdh">
        <input placeholder="Wdh">
        <input placeholder="Wdh">
      </div>
      <div class="row2" style="margin-top:6px">
        <input placeholder="Gewicht (kg)" value="${sug.weight}">
        <input placeholder="Notiz (optional)">
      </div>
    `;
    planEl.appendChild(ex);
  });
}

// Init
sessionSel.value = localStorage.getItem(LS_LAST) || "night_upper";
renderPlan();
</script>
</body>
</html>
